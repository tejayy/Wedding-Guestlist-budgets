<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#36255C">
<title>Shaadi Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Claymorphism tokens: Violet #36255C × Lavender #D2C3F6 ================= */
:root{
  --bg:#dcd4f0;
  --card:#ece6fa;
  --card-2:#f5f1fd;
  --text:#36255c;
  --muted:#7b6ea3;
  --accent:#36255c; --a1:#4a3578; --a2:#6d4fa3; --on-accent:#fff;
  --lav:#d2c3f6; --rose:#e3a4c0;
  --ok:#2f7d5b; --ok-bg:#cbeadb;
  --warn:#9c6b12; --warn-bg:#f6e2b2;
  --bad:#c24b5a; --bad-bg:#f5d0d6;
  /* Clay shadows: soft outer + puffy inner highlights */
  --clay:0 12px 24px rgba(54,37,92,.16),inset 0 2px 3px rgba(255,255,255,.9),inset 0 -5px 10px rgba(54,37,92,.08);
  --clay-sm:0 6px 14px rgba(54,37,92,.12),inset 0 2px 2px rgba(255,255,255,.85),inset 0 -3px 6px rgba(54,37,92,.07);
  --clay-in:inset 0 3px 8px rgba(54,37,92,.12),inset 0 -2px 3px rgba(255,255,255,.7);
  --btn-shadow:0 8px 18px rgba(54,37,92,.3),inset 0 2px 3px rgba(255,255,255,.35),inset 0 -4px 8px rgba(0,0,0,.18);
  --header-grad:linear-gradient(135deg,#2c1d4e 0%,#36255c 50%,#4a3578 100%);
  --line:rgba(54,37,92,.12);
}
[data-theme="dark"]{
  --bg:#231a3c;
  --card:#322651;
  --card-2:#3b2d5f;
  --text:#efe9fb;
  --muted:#a99bcb;
  --accent:#d2c3f6; --a1:#cbb8f4; --a2:#b399ec;
  --on-accent:#36255c;
  --lav:#d2c3f6; --rose:#e3a4c0;
  --ok:#7fd1a8; --ok-bg:#2b4a3e;
  --warn:#e8ba60; --warn-bg:#4a3d22;
  --bad:#ff9dab; --bad-bg:#4e2830;
  --clay:0 12px 24px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.09),inset 0 -5px 10px rgba(0,0,0,.28);
  --clay-sm:0 6px 14px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.08),inset 0 -3px 6px rgba(0,0,0,.25);
  --clay-in:inset 0 3px 8px rgba(0,0,0,.35),inset 0 -2px 3px rgba(255,255,255,.06);
  --btn-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.4),inset 0 -4px 8px rgba(54,37,92,.25);
  --line:rgba(255,255,255,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--text);font-size:15px;overflow:hidden;
  background:
    radial-gradient(60% 40% at 85% 0%,rgba(210,195,246,.7),transparent 65%),
    radial-gradient(50% 40% at 0% 100%,rgba(210,195,246,.55),transparent 65%),
    var(--bg)}
[data-theme="dark"] body{background:
    radial-gradient(60% 40% at 85% 0%,rgba(74,53,120,.5),transparent 65%),
    radial-gradient(50% 40% at 0% 100%,rgba(54,37,92,.6),transparent 65%),
    var(--bg)}

/* ================= App shell (max 480px, centered) ================= */
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:1;background:transparent}

/* Header: deep violet clay */
header{background:var(--header-grad);color:#fff;padding:18px 18px 20px;border-radius:0 0 30px 30px;position:relative;z-index:2;
  box-shadow:0 12px 26px rgba(44,29,78,.45),inset 0 2px 3px rgba(255,255,255,.18),inset 0 -6px 12px rgba(0,0,0,.25)}
header .hrow{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
header h1 span{color:var(--lav)}
header .sub{font-size:11.5px;opacity:.8;margin:2px 0 0}
.hbtns{display:flex;gap:8px}
.hbtns .icon-btn{background:rgba(210,195,246,.16);border-radius:14px;color:#fff;min-width:42px;min-height:42px;font-size:17px;
  box-shadow:inset 0 2px 2px rgba(255,255,255,.2),inset 0 -3px 6px rgba(0,0,0,.2);transition:transform .12s}
.hbtns .icon-btn:active{transform:scale(.92)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:20px}
section{display:none;animation:fade .2s ease}
section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ================= Shared controls ================= */
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--text);background:var(--card-2);border:0;border-radius:16px;min-height:48px;padding:0 16px;width:100%;box-shadow:var(--clay-in)}
input::placeholder{color:var(--muted);opacity:.75}
input:focus,select:focus{outline:2.5px solid var(--a2);outline-offset:2px}
.btn{min-height:50px;padding:0 20px;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-accent);font-weight:600;font-size:15.5px;
  box-shadow:var(--btn-shadow);transition:transform .1s,box-shadow .15s}
.btn:active{transform:scale(.96);box-shadow:inset 0 3px 8px rgba(0,0,0,.3)}
.btn.ghost{background:var(--card-2);color:var(--accent);box-shadow:var(--clay-sm)}
.btn.ghost:active{box-shadow:var(--clay-in)}
.stepper{display:flex;align-items:center;background:var(--card-2);border-radius:16px;overflow:hidden;flex-shrink:0;box-shadow:var(--clay-in)}
.stepper button{width:44px;height:48px;background:transparent;font-size:20px;font-weight:700;color:var(--accent)}
.stepper button:active{transform:scale(.9)}
.stepper .n{min-width:30px;text-align:center;font-weight:700}

/* ================= Floating Add button (FAB) ================= */
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;
  width:62px;height:62px;border-radius:22px;font-size:30px;font-weight:600;line-height:1;color:var(--on-accent);
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 26px rgba(54,37,92,.45),inset 0 2px 3px rgba(255,255,255,.35),inset 0 -5px 10px rgba(0,0,0,.2);
  display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab .plus{display:block;transform:translateY(-1px)}

/* Summary strip: puffy clay pills */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.stat{background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;box-shadow:var(--clay)}
.stat b{display:block;font-size:21px;line-height:1.2;color:var(--accent);font-weight:700}
.stat small{color:var(--muted);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}

/* Filters */
.filters{padding:12px 14px 4px;display:grid;gap:10px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pills::-webkit-scrollbar{display:none}
.pill-btn{flex-shrink:0;min-height:42px;padding:0 18px;border-radius:21px;background:var(--card);font-weight:600;font-size:13px;color:var(--muted);box-shadow:var(--clay-sm);transition:all .15s}
.pill-btn.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-accent);box-shadow:var(--btn-shadow)}

/* ================= Compact guest list (clay rows) ================= */
.list{padding:12px 14px;display:grid;gap:10px}
.swipe{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#c24b5a,#a83a48)}
.swipe::after{content:"Delete";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:600;font-size:13px}
.grow-item{background:var(--card);border-radius:22px;box-shadow:var(--clay);
  display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;z-index:1;transition:transform .2s;touch-action:pan-y}
.grow-item:active{box-shadow:var(--clay-in)}
.grow-item.dragging{transition:none}
.avatar{width:44px;height:44px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:17px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--lav),#b9a5ef);color:var(--accent);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 6px rgba(54,37,92,.15)}
[data-theme="dark"] .avatar{color:#36255c}
.gmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gmeta b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta small{color:var(--muted);font-size:12px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;font-weight:700;font-size:12px;flex-shrink:0;box-shadow:var(--clay-sm);transition:transform .1s}
.chip:active{transform:scale(.93);box-shadow:var(--clay-in)}
.chip.Invited{background:var(--warn-bg);color:var(--warn)}
.chip.Confirmed{background:var(--ok-bg);color:var(--ok)}
.chip.Declined{background:var(--bad-bg);color:var(--bad)}
.chev{color:var(--muted);font-size:18px;flex-shrink:0;opacity:.55}

/* ================= Bottom sheet dialog (clay) ================= */
.overlay{position:fixed;inset:0;background:rgba(44,29,78,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:480px;border-radius:30px 30px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));
  background:var(--card);box-shadow:0 -14px 40px rgba(44,29,78,.4),inset 0 2px 3px rgba(255,255,255,.7);
  animation:up .28s cubic-bezier(.2,.9,.3,1)}
[data-theme="dark"] .sheet{box-shadow:0 -14px 40px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.08)}
@keyframes up{from{transform:translateY(50px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;margin:8px auto 14px}
.sheet h2{margin:0 0 14px;font-size:17px;font-weight:700}
.sheet .field{margin-bottom:14px}
.flabel{font-size:11.5px;color:var(--muted);margin:0 0 6px 4px;display:block;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:48px;border-radius:15px;background:var(--card-2);font-weight:700;font-size:13px;color:var(--muted);box-shadow:var(--clay-sm);transition:all .15s}
.seg button.on.Invited{background:var(--warn-bg);color:var(--warn);box-shadow:var(--clay-in)}
.seg button.on.Confirmed{background:var(--ok-bg);color:var(--ok);box-shadow:var(--clay-in)}
.seg button.on.Declined{background:var(--bad-bg);color:var(--bad);box-shadow:var(--clay-in)}
.count-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border-radius:16px;padding:5px 6px 5px 16px;box-shadow:var(--clay-in)}
.count-row span{font-size:14px;font-weight:600}
.sheet .actions{display:grid;grid-template-columns:50px 1fr 1fr;gap:10px;margin-top:18px}
.sheet .actions .btn{min-height:54px;padding:0}
.sheet .delbtn{border-radius:16px;background:var(--bad-bg);color:var(--bad);font-size:18px;min-height:54px;box-shadow:var(--clay-sm)}
.sheet .delbtn:active{box-shadow:var(--clay-in)}

/* ================= Budget ================= */
.pad{padding:12px 14px}
.hero{margin:14px 14px 0;background:var(--header-grad);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;
  box-shadow:0 14px 30px rgba(44,29,78,.4),inset 0 2px 3px rgba(255,255,255,.18),inset 0 -8px 14px rgba(0,0,0,.22)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(55% 70% at 88% 0%,rgba(210,195,246,.25),transparent 60%)}
.hero>*{position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero small{opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.hero .big{font-size:29px;font-weight:700;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero .big.neg{color:#ffb9c2}
.hero .cols{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.hero .cols div small{display:block}
.hero .cols div b{font-size:15px}
.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.28);overflow:hidden;margin-top:14px;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e5d9fb,#d2c3f6);border-radius:7px;box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 10px rgba(210,195,246,.5);transition:width .3s}
.bar i.over{background:#ff9dab;box-shadow:inset 0 2px 2px rgba(255,255,255,.4)}
.hero .cap{font-size:11px;opacity:.8;margin:8px 0 0}
.budget-set{display:flex;gap:8px;align-items:center}
.budget-set input{background:rgba(210,195,246,.15);color:#fff;min-height:42px;font-size:14px;border-radius:13px;box-shadow:inset 0 2px 6px rgba(0,0,0,.3),inset 0 -1px 2px rgba(255,255,255,.12)}
.budget-set input::placeholder{color:rgba(255,255,255,.6)}
.budget-set input:focus{outline-color:var(--lav)}
.box{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--clay);margin:14px 14px 0}
.h2{font-size:13px;font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);font-size:14px;gap:10px}
.cat-row:last-child{border:0}
.cat-row .cb{height:8px;border-radius:5px;background:rgba(54,37,92,.1);flex:1;overflow:hidden;max-width:130px;box-shadow:inset 0 1px 3px rgba(54,37,92,.15)}
[data-theme="dark"] .cat-row .cb{background:rgba(0,0,0,.3)}
.cat-row .cb i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:5px}
.cat-row span:last-child{font-weight:700;white-space:nowrap}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--card-2);border-radius:16px;padding:4px;box-shadow:var(--clay-in)}
.toggle button{min-height:46px;border-radius:13px;background:transparent;font-weight:700;color:var(--muted);font-size:13.5px;transition:all .15s}
.toggle button.on.Paid{background:var(--ok-bg);color:var(--ok);box-shadow:var(--clay-sm)}
.toggle button.on.Pending{background:var(--warn-bg);color:var(--warn);box-shadow:var(--clay-sm)}

/* Compact expense rows */
.erow{background:var(--card);border-radius:22px;box-shadow:var(--clay);padding:12px 14px;display:flex;align-items:center;gap:12px}
.eic{width:40px;height:40px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,var(--lav),#b9a5ef);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 6px rgba(54,37,92,.15)}
.emeta{flex:1;min-width:0}
.emeta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emeta small{color:var(--muted);font-size:12px}
.eamt{font-weight:700;font-size:14.5px;white-space:nowrap}
.eactions{display:flex;gap:4px}
.eactions .icon-btn{min-width:38px;min-height:38px;font-size:15px;border-radius:12px;background:var(--card-2);box-shadow:var(--clay-sm)}
.eactions .icon-btn:active{box-shadow:var(--clay-in)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.Paid{background:var(--ok)}.dot.Pending{background:var(--warn)}

/* ================= Empty / toast / nav ================= */
.empty{text-align:center;color:var(--muted);padding:38px 16px}
.empty .em{font-size:44px;display:block;margin-bottom:10px}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:2px}
.empty small{font-size:13px}
#toast{position:absolute;left:14px;right:92px;bottom:96px;background:#36255c;color:#fff;border-radius:18px;padding:8px 8px 8px 18px;display:none;align-items:center;justify-content:space-between;z-index:60;font-size:13.5px;
  box-shadow:0 12px 28px rgba(44,29,78,.5),inset 0 1px 2px rgba(255,255,255,.15)}
#toast.show{display:flex;animation:up .2s ease}
#toast button{background:transparent;color:var(--lav);font-weight:700;min-height:42px;padding:0 14px}
nav{display:grid;grid-template-columns:1fr 1fr;background:var(--card);box-shadow:0 -8px 20px rgba(54,37,92,.14),inset 0 2px 3px rgba(255,255,255,.6);padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] nav{box-shadow:0 -8px 20px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.06)}
nav button{min-height:64px;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:color .15s}
nav button .ic{font-size:21px;transition:transform .15s}
nav button.active{color:var(--accent)}
nav button.active .ic{transform:translateY(-2px) scale(1.18)}
nav button.active::before{content:"";position:absolute;top:6px;width:32px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:var(--clay-sm)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div>
        <h1>💍 Shaadi <span>Planner</span></h1>
        <p class="sub">Groom side · guests &amp; budget</p>
      </div>
      <div class="hbtns">
        <button class="icon-btn" id="exportBtn" title="Export guest list (CSV)" aria-label="Export guest list">⬇</button>
        <button class="icon-btn" id="themeBtn" title="Dark mode" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ================= GUESTS TAB ================= -->
    <section id="tab-guests" class="active">
      <div class="summary" id="gSummary" style="padding-top:16px"></div>

      <div class="filters">
        <input id="gSearch" type="search" placeholder="🔍 Naam se dhundo" aria-label="Search guests">
        <div class="pills" id="gPills">
          <button class="pill-btn on" data-st="">Sab</button>
          <button class="pill-btn" data-st="Invited">Invited</button>
          <button class="pill-btn" data-st="Confirmed">Confirmed</button>
          <button class="pill-btn" data-st="Declined">Declined</button>
        </div>
      </div>

      <div class="list" id="gList"></div>
    </section>

    <!-- ================= BUDGET TAB ================= -->
    <section id="tab-budget">
      <div class="hero" id="bHero"></div>
      <div class="box" id="bCats"></div>

      <form class="box form" id="expForm" autocomplete="off">
        <h3 class="h2" id="expTitle">Naya Expense</h3>
        <input id="eName" placeholder="Item (e.g. Sherwani, DJ)" maxlength="60" aria-label="Item name">
        <div class="two">
          <select id="eCat" aria-label="Category"></select>
          <input id="eAmt" inputmode="numeric" placeholder="Amount ₹" aria-label="Amount">
        </div>
        <div class="toggle" id="eStatus">
          <button type="button" data-v="Paid">✔ Paid</button>
          <button type="button" data-v="Pending" class="on Pending">⏳ Pending</button>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn" type="submit" style="flex:1" id="eSubmit">+ Add Expense</button>
          <button class="btn ghost" type="button" id="eCancel" style="display:none">Cancel</button>
        </div>
      </form>

      <div class="pad" style="padding-bottom:0">
        <div class="pills" id="ePills">
          <button class="pill-btn on" data-v="">Sab</button>
          <button class="pill-btn" data-v="Paid">Paid</button>
          <button class="pill-btn" data-v="Pending">Pending</button>
        </div>
      </div>
      <div class="list" id="eList"></div>
    </section>
  </main>

  <!-- Guest edit bottom-sheet dialog -->
  <div class="overlay" id="dlg">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <div class="grab"></div>
      <h2 id="dlgTitle">Guest Edit Karo</h2>
      <div class="field">
        <label class="flabel" for="dName">Naam</label>
        <input id="dName" maxlength="60">
      </div>
      <div class="field">
        <label class="flabel">Family members</label>
        <div class="count-row">
          <span id="dCountLabel">1 member</span>
          <div class="stepper">
            <button id="dMinus" aria-label="Kam karo">−</button>
            <span class="n" id="dCount">1</span>
            <button id="dPlus" aria-label="Badhao">+</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="flabel">Status</label>
        <div class="seg" id="dSeg">
          <button data-st="Invited">Invited</button>
          <button data-st="Confirmed">Confirmed</button>
          <button data-st="Declined">Declined</button>
        </div>
      </div>
      <div class="actions">
        <button class="delbtn" id="dDelete" aria-label="Delete guest">🗑</button>
        <button class="btn ghost" id="dCancel">Cancel</button>
        <button class="btn" id="dSave">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

  <!-- Floating add button (Guests tab) -->
  <button class="fab" id="fab" aria-label="Naya guest add karo"><span class="plus">+</span></button>

  <!-- Add-guest drawer dialog -->
  <div class="overlay" id="addDlg">
    <form class="sheet" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addTitle" autocomplete="off">
      <div class="grab"></div>
      <h2 id="addTitle">Naya Guest 💌</h2>
      <div class="field">
        <label class="flabel" for="aName">Naam</label>
        <input id="aName" placeholder="Guest ka naam likho…" maxlength="60" enterkeyhint="done">
      </div>
      <div class="field">
        <label class="flabel">Family members</label>
        <div class="count-row">
          <span id="aCountLabel">1 member</span>
          <div class="stepper">
            <button type="button" id="aMinus" aria-label="Kam karo">−</button>
            <span class="n" id="aCount">1</span>
            <button type="button" id="aPlus" aria-label="Badhao">+</button>
          </div>
        </div>
      </div>
      <div class="actions" style="grid-template-columns:1fr 2fr">
        <button class="btn ghost" type="button" id="aCancel">Band Karo</button>
        <button class="btn" type="submit">+ Add Guest</button>
      </div>
    </form>
  </div>

  <nav>
    <button data-tab="guests" class="active"><span class="ic">👥</span>Guests</button>
    <button data-tab="budget"><span class="ic">💰</span>Budget</button>
  </nav>
</div>

<script>
/* =====================================================
   Shaadi Planner — vanilla JS, no backend.
   All data persists in localStorage under one key.
   ===================================================== */
const KEY = 'shaadi-planner-v1';
const CATEGORIES = ['Venue','Catering','Decor','Clothes','Photography','Travel','Other'];
const CAT_ICONS = {Venue:'🏛',Catering:'🍽',Decor:'🌸',Clothes:'👗',Photography:'📸',Travel:'🚗',Other:'📦'};
const STATUSES = ['Invited','Confirmed','Declined'];      // tap-to-cycle order
const SIDE_ONLY = 'Groom';   // list is Groom-side only; change to 'Bride' to switch
const $ = (id) => document.getElementById(id);

/* ---------- State + persistence ---------- */
const defaults = { guests:[], expenses:[], budget:0, theme:'light', tab:'guests' };
let S = Object.assign({}, defaults, load());
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('Save nahi ho paya (storage full?)'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- Helpers ---------- */
const inr = new Intl.NumberFormat('en-IN');                // 150000 -> 1,50,000
const money = (n) => '₹' + inr.format(Math.round(n || 0));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => parseInt(String(v).replace(/[^\d]/g,''),10) || 0;   // "1,50,000" -> 150000
const clamp = (n) => Math.max(1, Math.min(99, n));

/* Toast with Undo (used after deletes) */
let toastTimer, undoFn = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg;
  undoFn = undo || null;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}
$('toastUndo').onclick = () => { if (undoFn) undoFn(); $('toast').classList.remove('show'); };

/* ---------- Theme + tabs ---------- */
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  $('themeBtn').textContent = S.theme === 'dark' ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };

function showTab(t){
  S.tab = t; save();
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $('exportBtn').style.visibility = t === 'guests' ? 'visible' : 'hidden';
  $('fab').style.display = t === 'guests' ? '' : 'none';
  closeAddDrawer();
  $('main').scrollTop = 0;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* =====================================================
   GUESTS
   ===================================================== */
/* ---------- Add-guest drawer (opened from the FAB) ---------- */
let aCount = 1;

function openAddDrawer(){
  aCount = 1;
  $('aName').value = '';
  syncAddDrawer();
  $('addDlg').classList.add('open');
  setTimeout(() => $('aName').focus(), 150);
}
function closeAddDrawer(){ $('addDlg').classList.remove('open'); }
function syncAddDrawer(){
  $('aCount').textContent = aCount;
  $('aCountLabel').textContent = `${aCount} ${aCount === 1 ? 'member' : 'members'}`;
}
$('fab').onclick = openAddDrawer;
$('aCancel').onclick = closeAddDrawer;
$('aMinus').onclick = () => { aCount = clamp(aCount - 1); syncAddDrawer(); };
$('aPlus').onclick  = () => { aCount = clamp(aCount + 1); syncAddDrawer(); };
$('addDlg').addEventListener('click', (e) => { if (e.target === $('addDlg')) closeAddDrawer(); });

// Submit fires on Enter key too. Drawer stays open and refocuses so you can keep adding.
$('addForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('aName').value.trim();
  if (!name) { $('aName').focus(); return; }
  S.guests.unshift({ id: uid(), name, count: aCount, side: SIDE_ONLY, status: 'Invited' });
  save();
  $('aName').value = '';
  aCount = 1; syncAddDrawer();
  renderGuests();
  toast(`"${name}" add ho gaya`);
  $('aName').focus();
};

$('gSearch').addEventListener('input', renderGuests);
$('gPills').addEventListener('click', (e) => {
  const b = e.target.closest('.pill-btn'); if (!b) return;
  $('gPills').querySelectorAll('.pill-btn').forEach(p => p.classList.toggle('on', p === b));
  renderGuests();
});
const gFilterStatus = () => $('gPills').querySelector('.pill-btn.on').dataset.st;

function renderGuests(){
  const g = S.guests.filter(x => x.side === SIDE_ONLY);   // only Groom side is shown/counted
  const people = g.reduce((a, x) => a + x.count, 0);
  const conf = g.filter(x => x.status === 'Confirmed').reduce((a, x) => a + x.count, 0);
  $('gSummary').innerHTML =
    `<div class="stat"><b>${g.length}</b><small>Families</small></div>
     <div class="stat"><b>${people}</b><small>People</small></div>
     <div class="stat"><b>${conf}</b><small>Confirmed</small></div>`;

  const q = $('gSearch').value.trim().toLowerCase(), st = gFilterStatus();
  const rows = g.filter(x => (!q || x.name.toLowerCase().includes(q)) && (!st || x.status === st));

  if (!g.length) {
    $('gList').innerHTML = `<div class="empty"><span class="em">💌</span><b>Pehla guest add karo</b><small>Neeche + button dabao.</small></div>`;
    return;
  }
  if (!rows.length) {
    $('gList').innerHTML = `<div class="empty"><span class="em">🔍</span><b>Koi match nahi mila</b><small>Search ya filter badal ke dekho.</small></div>`;
    return;
  }
  $('gList').innerHTML = rows.map(x => `
    <div class="swipe" data-id="${x.id}">
      <div class="grow-item" data-a="open" role="button" tabindex="0" aria-label="${esc(x.name)} edit karo">
        <div class="avatar">${esc(x.name.trim()[0] || '?')}</div>
        <div class="gmeta">
          <b>${esc(x.name)}</b>
          <small>👨‍👩‍👧 ${x.count} ${x.count === 1 ? 'member' : 'members'} · ${SIDE_ONLY} side</small>
        </div>
        <button class="chip ${x.status}" data-a="status" aria-label="Status badlo">${x.status}</button>
        <span class="chev">›</span>
      </div>
    </div>`).join('');
}

// One delegated click handler: status chip cycles, row opens the dialog
$('gList').addEventListener('click', (e) => {
  const sw = e.target.closest('.swipe'); if (!sw) return;
  const x = S.guests.find(v => v.id === sw.dataset.id); if (!x) return;
  const chip = e.target.closest('[data-a="status"]');
  if (chip) {
    x.status = STATUSES[(STATUSES.indexOf(x.status) + 1) % STATUSES.length];
    save(); renderGuests();
    return;
  }
  if (e.target.closest('[data-a="open"]')) openDialog(x.id);
});
// Keyboard access: Enter on a row opens the dialog
$('gList').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-a="open"]')) openDialog(e.target.closest('.swipe').dataset.id);
});

function deleteGuest(id){
  const i = S.guests.findIndex(v => v.id === id); if (i < 0) return;
  const [removed] = S.guests.splice(i, 1);
  save(); renderGuests();
  toast(`"${removed.name}" hata diya`, () => { S.guests.splice(i, 0, removed); save(); renderGuests(); });
}

/* Swipe-left to delete (touch). Dragging past 90px deletes. */
(function swipe(){
  let card = null, sx = 0, sy = 0, dx = 0, locked = false;
  const list = $('gList');
  list.addEventListener('touchstart', (e) => {
    if (e.target.closest('button,input')) return;
    card = e.target.closest('.grow-item'); if (!card) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; locked = false;
  }, {passive:true});
  list.addEventListener('touchmove', (e) => {
    if (!card) return;
    const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if (!locked && Math.abs(my) > Math.abs(mx)) { card = null; return; }   // vertical scroll wins
    locked = true; dx = Math.min(0, mx);
    card.classList.add('dragging'); card.style.transform = `translateX(${dx}px)`;
  }, {passive:true});
  list.addEventListener('touchend', () => {
    if (!card) return;
    card.classList.remove('dragging');
    if (dx < -90) deleteGuest(card.closest('.swipe').dataset.id); else card.style.transform = '';
    card = null;
  });
})();

/* ---------- Guest edit bottom-sheet dialog ---------- */
let dlgId = null, dlgCount = 1, dlgStatus = 'Invited';

function openDialog(id){
  const x = S.guests.find(v => v.id === id); if (!x) return;
  dlgId = id; dlgCount = x.count; dlgStatus = x.status;
  $('dName').value = x.name;
  syncDialog();
  $('dlg').classList.add('open');
  setTimeout(() => { $('dName').focus(); $('dName').select(); }, 120);
}
function closeDialog(){ $('dlg').classList.remove('open'); dlgId = null; }
function syncDialog(){
  $('dCount').textContent = dlgCount;
  $('dCountLabel').textContent = `${dlgCount} ${dlgCount === 1 ? 'member' : 'members'}`;
  $('dSeg').querySelectorAll('button').forEach(b => b.className = b.dataset.st === dlgStatus ? 'on ' + dlgStatus : '');
}
$('dMinus').onclick = () => { dlgCount = clamp(dlgCount - 1); syncDialog(); };
$('dPlus').onclick  = () => { dlgCount = clamp(dlgCount + 1); syncDialog(); };
$('dSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  dlgStatus = b.dataset.st; syncDialog();
});
$('dSave').onclick = () => {
  const x = S.guests.find(v => v.id === dlgId); if (!x) return closeDialog();
  const name = $('dName').value.trim();
  if (!name) { $('dName').focus(); return; }
  x.name = name; x.count = dlgCount; x.status = dlgStatus;
  save(); closeDialog(); renderGuests();
  toast('Guest update ho gaya');
};
$('dDelete').onclick = () => { const id = dlgId; closeDialog(); deleteGuest(id); };
$('dCancel').onclick = closeDialog;
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) closeDialog(); });   // tap outside
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('dlg').classList.contains('open')) closeDialog();
    if ($('addDlg').classList.contains('open')) closeAddDrawer();
  }
  if (e.key === 'Enter' && e.target === $('dName')) $('dSave').click();
});

/* ---------- Export guest list as CSV ---------- */
$('exportBtn').onclick = () => {
  const mine = S.guests.filter(x => x.side === SIDE_ONLY);
  if (!mine.length) { toast('Pehle kuch guests add karo'); return; }
  const cell = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [['Name','Family count','Side','Status'].map(cell).join(',')]
    .concat(mine.map(x => [x.name, x.count, x.side, x.status].map(cell).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'guest-list.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* =====================================================
   BUDGET
   ===================================================== */
let editingExp = null, formStatus = 'Pending';
$('eCat').innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join('');

// Amount inputs format live with Indian commas
$('eAmt').addEventListener('input', (e) => { const n = num(e.target.value); e.target.value = n ? inr.format(n) : ''; });

function setFormStatus(v){
  formStatus = v;
  $('eStatus').querySelectorAll('button').forEach(b => { b.className = b.dataset.v === v ? 'on ' + v : ''; });
}
$('eStatus').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setFormStatus(b.dataset.v); });
setFormStatus('Pending');

function resetExpForm(){
  editingExp = null;
  $('eName').value = ''; $('eAmt').value = ''; $('eCat').value = CATEGORIES[0];
  setFormStatus('Pending');
  $('expTitle').textContent = 'Naya Expense';
  $('eSubmit').textContent = '+ Add Expense';
  $('eCancel').style.display = 'none';
}
$('eCancel').onclick = resetExpForm;

$('expForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('eName').value.trim(), amount = num($('eAmt').value);
  if (!name) { $('eName').focus(); return; }
  if (!amount) { $('eAmt').focus(); return; }
  const data = { name, category: $('eCat').value, amount, status: formStatus };
  if (editingExp) Object.assign(S.expenses.find(x => x.id === editingExp) || {}, data);
  else S.expenses.unshift({ id: uid(), ...data });
  save(); resetExpForm(); renderBudget();
  $('eName').focus();
};

$('ePills').addEventListener('click', (e) => {
  const b = e.target.closest('.pill-btn'); if (!b) return;
  $('ePills').querySelectorAll('.pill-btn').forEach(p => p.classList.toggle('on', p === b));
  renderExpenses();
});
const eFilter = () => $('ePills').querySelector('.pill-btn.on').dataset.v;

/* Hero summary card with inline budget editor */
function renderHero(){
  const spent = S.expenses.reduce((a, x) => a + x.amount, 0);
  const paid = S.expenses.filter(x => x.status === 'Paid').reduce((a, x) => a + x.amount, 0);
  const remaining = S.budget - spent;
  const pct = S.budget ? Math.min(100, spent / S.budget * 100) : (spent ? 100 : 0);
  const over = remaining < 0;
  $('bHero').innerHTML =
    `<div class="top">
       <div>
         <small>Remaining</small>
         <div class="big ${over ? 'neg' : ''}">${over ? '−' : ''}${money(Math.abs(remaining))}</div>
       </div>
       <div class="budget-set">
         <input id="bTotal" inputmode="numeric" placeholder="Budget ₹" value="${S.budget ? inr.format(S.budget) : ''}" aria-label="Total budget">
       </div>
     </div>
     <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div>
     <p class="cap">${S.budget ? Math.round(spent / S.budget * 100) + '% budget use hua' : 'Upar total budget set karo'}</p>
     <div class="cols">
       <div><small>Budget</small><b>${money(S.budget)}</b></div>
       <div><small>Spent</small><b>${money(spent)}</b></div>
       <div><small>Paid</small><b>${money(paid)}</b></div>
       <div><small>Pending</small><b>${money(spent - paid)}</b></div>
     </div>`;
  $('bTotal').addEventListener('input', (e) => {
    S.budget = num(e.target.value); save();
    const pos = e.target.selectionStart;
    e.target.value = S.budget ? inr.format(S.budget) : '';
    e.target.setSelectionRange(pos, pos);
    refreshHeroNumbers();
  });
}
/* Update hero numbers without rebuilding the input you're typing in */
function refreshHeroNumbers(){
  const spent = S.expenses.reduce((a, x) => a + x.amount, 0);
  const remaining = S.budget - spent;
  const over = remaining < 0;
  const big = $('bHero').querySelector('.big');
  big.textContent = (over ? '−' : '') + money(Math.abs(remaining));
  big.classList.toggle('neg', over);
  const pct = S.budget ? Math.min(100, spent / S.budget * 100) : (spent ? 100 : 0);
  const bar = $('bHero').querySelector('.bar i');
  bar.style.width = pct + '%'; bar.classList.toggle('over', over);
  $('bHero').querySelector('.cap').textContent = S.budget ? Math.round(spent / S.budget * 100) + '% budget use hua' : 'Upar total budget set karo';
  const cols = $('bHero').querySelectorAll('.cols b');
  cols[0].textContent = money(S.budget);
}

function renderCategories(){
  const totals = {};
  S.expenses.forEach(x => totals[x.category] = (totals[x.category] || 0) + x.amount);
  const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $('bCats').innerHTML = `<h3 class="h2">Category-wise</h3>` + (rows.length
    ? rows.map(([c, t]) => `
      <div class="cat-row">
        <span style="white-space:nowrap">${CAT_ICONS[c] || '📦'} ${esc(c)}</span>
        <span class="cb"><i style="width:${Math.round(t / max * 100)}%"></i></span>
        <span>${money(t)}</span>
      </div>`).join('')
    : `<div style="color:var(--muted);font-size:14px">Abhi koi expense nahi.</div>`);
}

function renderExpenses(){
  const f = eFilter();
  const rows = S.expenses.filter(x => !f || x.status === f);
  if (!S.expenses.length) {
    $('eList').innerHTML = `<div class="empty"><span class="em">🪔</span><b>Pehla expense add karo</b><small>Upar form bhar ke shuru karo.</small></div>`;
    return;
  }
  if (!rows.length) { $('eList').innerHTML = `<div class="empty"><b>Is filter me kuch nahi</b></div>`; return; }
  $('eList').innerHTML = rows.map(x => `
    <div class="erow" data-id="${x.id}">
      <div class="eic">${CAT_ICONS[x.category] || '📦'}</div>
      <div class="emeta">
        <b>${esc(x.name)}</b>
        <small><span class="dot ${x.status}"></span>${x.status} · ${esc(x.category)}</small>
      </div>
      <div class="eamt">${money(x.amount)}</div>
      <div class="eactions">
        <button class="icon-btn" data-a="edit" aria-label="Edit">✏️</button>
        <button class="icon-btn" data-a="del" aria-label="Delete">🗑</button>
      </div>
    </div>`).join('');
}

$('eList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-a]'); if (!btn) return;
  const id = btn.closest('.erow').dataset.id;
  const i = S.expenses.findIndex(v => v.id === id); if (i < 0) return;
  const x = S.expenses[i];
  if (btn.dataset.a === 'edit') {
    editingExp = id;
    $('eName').value = x.name; $('eCat').value = x.category; $('eAmt').value = inr.format(x.amount);
    setFormStatus(x.status);
    $('expTitle').textContent = 'Expense Edit Karo';
    $('eSubmit').textContent = 'Update Expense';
    $('eCancel').style.display = '';
    $('expForm').scrollIntoView({ behavior:'smooth', block:'center' });
    $('eName').focus();
  }
  if (btn.dataset.a === 'del') {
    S.expenses.splice(i, 1);
    if (editingExp === id) resetExpForm();
    save(); renderBudget();
    toast(`"${x.name}" hata diya`, () => { S.expenses.splice(i, 0, x); save(); renderBudget(); });
  }
});

function renderBudget(){ renderHero(); renderCategories(); renderExpenses(); }

/* ---------- Boot ---------- */
applyTheme();
renderGuests();
renderBudget();
showTab(S.tab === 'budget' ? 'budget' : 'guests');
</script>
</body>
</html>
